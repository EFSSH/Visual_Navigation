task_manager_node:
  ros__parameters:
    use_sim_time: true
    task_file: ''
    autostart: false
    start_topic: /task/start
    cancel_topic: /task/cancel
    state_topic: /task/state
    events_topic: /task/events
    report_topic: /task/report
    search_request_topic: /search/request
    search_result_topic: /search/result
    amcl_pose_topic: /amcl_pose
    navigate_action: /navigate_to_pose
    spin_action: /spin
    map_frame: map
    robot_frame: base_link
    # Checked before the task starts: topic|type|max age (s).
    sensor_checks:
      - /scan|sensor_msgs/msg/LaserScan|1.0
      - /odom|nav_msgs/msg/Odometry|1.0
      - /intel_realsense_r200_depth/points|sensor_msgs/msg/PointCloud2|2.0
      - /rear_realsense_depth/points|sensor_msgs/msg/PointCloud2|2.0
    # AMCL covariance limits for "localized" (m^2, rad^2).
    max_position_variance: 0.5
    max_yaw_variance: 0.3
    spin_time_allowance_sec: 20.0
