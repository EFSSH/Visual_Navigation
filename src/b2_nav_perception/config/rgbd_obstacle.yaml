rgbd_obstacle_node:
  ros__parameters:
    use_sim_time: true

    input_topic: /intel_realsense_r200_depth/points
    output_topic: /vision/obstacle_cloud
    target_frame: base_link

    # Keep points in the robot's forward obstacle-detection box.
    x_min: 0.20
    x_max: 3.00
    y_min: -1.50
    y_max: 1.50
    z_min: 0.05
    z_max: 1.50

    # Keep one point out of every four to reduce CPU and topic bandwidth.
    point_step: 4
