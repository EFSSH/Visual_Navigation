trajectory_executor_node:
  ros__parameters:
    use_sim_time: true
    # Model adapters publish nav_msgs/Path here (odom or map frame).
    trajectory_topic: /execution/trajectory
    costmap_topic: /local_costmap/costmap
    feedback_topic: /execution/feedback
    events_topic: /execution/events
    safety_stop_topic: /safety/lidar_stop
    watchdog_state_topic: /robot/watchdog_state
    follow_path_action: /follow_path
    # Pure-tracking controller from nav2_jazzy_params.yaml; it follows the
    # given path instead of re-sampling around it like DWB.
    controller_id: TrackPath
    goal_checker_id: general_goal_checker
    progress_checker_id: progress_checker
    robot_frame: base_link
    allowed_frames: [odom, map]
    # A path must be replaced within this time after its stamp, otherwise
    # the active goal is cancelled.
    validity_sec: 1.5
    costmap_max_age_sec: 2.0
    require_costmap: true
    feedback_rate_hz: 5.0
    max_age_sec: 1.0
    max_future_sec: 0.2
    max_spacing_m: 0.5
    max_length_m: 6.0
    max_heading_change_rad_per_m: 3.0
    # OccupancyGrid scale: 100 lethal, 99 inscribed.
    lethal_cost: 99
    reject_outside_costmap: true
    source_label: unlabelled
